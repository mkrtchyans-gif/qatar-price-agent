name: Qatar Airways prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: qatar-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        city: [Boston, "Los Angeles"]

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Write Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          chmod 600 service_account.json

      - name: Run diagnostic agent
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          HEADLESS: "1"
          CITY: ${{ matrix.city }}
          SEARCH_TIMEOUT_MS: "45000"
          DIAGNOSTIC_ONLY: "1"
        run: python agent_v5.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qatar-diagnostics-${{ matrix.city }}
          path: artifacts/
          if-no-files-found: warn
