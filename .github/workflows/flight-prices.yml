name: Flight prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: flight-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        city: [Boston, "Los Angeles"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write Google credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          chmod 600 service_account.json
          python -c "import json;json.load(open('service_account.json'));print('credentials OK')"

      - name: Check prices
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CITY: ${{ matrix.city }}
          AIRLINE_FILTER: "QR"
          ALERT_DROP_PCT: "15"
          ADULTS: "3"
          CHILDREN: "1"
          CHILD_RATIO: "0.75"
          CURRENCY: usd
          MARKET: ru
          MAX_STOPS: "2"
        run: python main.py
